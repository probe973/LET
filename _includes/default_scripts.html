    <!-- MathJax Script for LaTeX equations -->
{%- assign latx = page.mj | default: 1 -%}

{%- if latx == 1 or latx == "1" -%}
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js">
    </script>
{%- endif -%}

{%- assign tier = page.interactive | default: 2 -%}

{%- if tier == 2 or tier == "2" -%}
    <!-- Level 2 (Default): Load all three scripts -->
    <script src="https://unpkg.com/mathlive@0.100.0/dist/mathlive.min.js" defer></script>
    <script src="https://unpkg.com/@cortex-js/compute-engine@0.19.0/dist/compute-engine.min.js" defer></script>
    <script src="{{ "/assets/js/scripts.js" | relative_url }}" defer></script>

{%- elsif tier == 1 or tier == "1" -%}
    <!-- Level 1: Load only scripts.js -->
    <script src="{{ "/assets/js/scripts.js" | relative_url }}" defer></script>

{%- endif -%}
<!-- Level 0: Loads nothing if page.interactive: 0 is explicitly set -->
