<script>
    document.addEventListener('DOMContentLoaded', () => {
        if (window.initSimultaneousTest && window.diffGenerators) {
            window.initSimultaneousTest([
                { generator: window.diffGenerators.lagrangian1, count: 2 },
                { generator: window.diffGenerators.lagrangian2, count: 1 }

            ]);
        } else {
            console.error("Scripts failed to load. Ensure variable names match in both files.");
        }
    });
</script>
