<!-- Required Libraries -->
<script src="https://unpkg.com/mathlive"></script>
<script src="https://unpkg.com/@cortex-js/compute-engine"></script>

<!-- 1. Load Generators -->
<script src="{{ '/assets/js/nbs4107a/algebra-simplifying.js' | relative_url }}"></script>
<!-- 2. Load Core Logic -->
<script src="{{ '/assets/js/algebra-revision-core.js' | relative_url }}"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Double-check: variable name must be exactly what is in algebra-simplifying.js
        if (window.initAlgebraRevisionTest && window.simplifyingGenerators) {
            window.initAlgebraRevisionTest([
                { generator: window.simplifyingGenerators.simplify_multiplication, count: 3 },
                { generator: window.simplifyingGenerators.multiply_indices, count: 2 },
                { generator: window.simplifyingGenerators.divide_indices, count: 2 },
                { generator: window.simplifyingGenerators.power_indices, count: 2 },
                { generator: window.simplifyingGenerators.simplify_multiplication_powers, count: 3 },
                { generator: window.simplifyingGenerators.simplify_multiplication_division_power_powers, count: 2 },
                { generator: window.simplifyingGenerators.simplify_multiplication_division_power_powers2, count: 2 }
            ]);
        } else {
            console.error("Scripts failed to load. Ensure variable names match in both files.");
        }
    });
</script>
